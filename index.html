<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=yes se pinch karke zoom smooth chalega -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Fayora Films & Media | Pitch Deck</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0c10;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Full-Screen Container */
    .container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }

    /* Responsive Iframe without breaking styles */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <iframe 
      src="https://www.canva.com/design/DAHWehnp36A/a2pay3pyC0-FucYp-aZoug/view?embed" 
      allowfullscreen="allowfullscreen" 
      allow="autoplay; fullscreen"
      loading="eager">
    </iframe>
  </div>

</body>
</html>
