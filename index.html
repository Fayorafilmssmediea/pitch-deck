<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
  <title>Fayora Films & Media | Pitch Deck</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Screen Wrapper */
    .viewport-box {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
      position: relative;
    }

    /* Deck Frame Clip (Canva ke bottom watermark aur control bar ko cut karta hai) */
    .deck-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      border: none;
      outline: none;
      display: block;
    }

    /* Landscape Mode (Horizontal) */
    @media (orientation: landscape) {
      .deck-frame {
        width: 100vw;
        height: 100dvh;
        max-width: calc(100dvh * (16 / 9));
      }
      iframe {
        /* Height badha kar bottom watermark aur controls ko frame ke bahar push karta hai */
        height: calc(100% + 64px);
        margin-bottom: -64px;
      }
    }

    /* Portrait Mode (Vertical) */
    @media (orientation: portrait) {
      .deck-frame {
        width: 100vw;
        height: calc(100vw * (9 / 16));
        transform: scale(1.15);
        transform-origin: center center;
      }
      iframe {
        height: calc(100% + 55px);
        margin-bottom: -55px;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-box">
    <div class="deck-frame">
      <iframe 
        loading="lazy"
        src="https://www.canva.com/design/DAHWehnp36A/a2pay3pyC0-FucYp-aZoug/view?embed" 
        allowfullscreen="allowfullscreen" 
        allow="autoplay; fullscreen">
      </iframe>
    </div>
  </div>

</body>
</html>
