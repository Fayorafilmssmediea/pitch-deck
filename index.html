<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Fayora Media | Pitch Deck</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Screen Wrapper: Prevents browser address bar shifting */
    .screen-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
    }

    /* Deck Frame Clip: Crops Canva's bottom controls and watermark */
    .deck-crop-box {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }

    .deck-crop-box iframe {
      width: 100%;
      border: none;
      outline: none;
      display: block;
    }

    /* 1. LANDSCAPE (Horizontal - When Phone is Rotated or on PC) */
    @media (orientation: landscape) {
      .deck-crop-box {
        width: 100vw;
        height: 100dvh;
        max-width: calc(100dvh * (16 / 9));
      }
      /* Extra height clips Canva's bottom UI bar outside the container */
      .deck-crop-box iframe {
        height: calc(100% + 56px);
        margin-bottom: -56px;
      }
      .mobile-rotate-tip {
        display: none !important;
      }
    }

    /* 2. PORTRAIT (Vertical - Normal Mobile View) */
    @media (orientation: portrait) {
      .deck-crop-box {
        width: 100vw;
        height: calc(100vw * (9 / 16));
        transform: scale(1.18);
        transform-origin: center center;
      }
      .deck-crop-box iframe {
        height: calc(100% + 50px);
        margin-bottom: -50px;
      }
      .mobile-rotate-tip {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(18, 20, 26, 0.92);
        color: #ffffff;
        padding: 9px 18px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        z-index: 9999;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="screen-wrapper">
    <div class="deck-crop-box">
      <!-- Clean embed without bottom Canva attribution markup -->
      <iframe 
        loading="lazy"
        src="https://www.canva.com/design/DAHWehnp36A/a2pay3pyC0-FucYp-aZoug/view?embed" 
        allowfullscreen="allowfullscreen" 
        allow="autoplay; fullscreen">
      </iframe>
    </div>

    <!-- Rotated view guide for mobile clients -->
    <div class="mobile-rotate-tip" onclick="this.style.display='none'">
      <span>🔄</span> <strong>Rotate for Fullscreen view</strong>
    </div>
  </div>

</body>
</html>
